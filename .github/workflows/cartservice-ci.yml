name: cartservice CI

on:
  push:
    branches: [main]
    paths:
      - 'src/cartservice/**'
      - '.github/workflows/cartservice-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/cartservice/**'

jobs:
  lint-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cartservice/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test ../tests/cartservice.tests.csproj --no-restore --verbosity normal

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, codeql]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t cartservice:${{ github.sha }} \
            src/cartservice/src
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cartservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          docker tag cartservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/cartservice:${{ github.sha }}
          docker tag cartservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/cartservice:latest
          docker push ${{ steps.ecr.outputs.registry }}/cartservice:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/cartservice:latest

  deploy:
    name: Deploy to k3s
    needs: build-and-scan
    if: github.event_name == 'push'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy new image
        run: |
          kubectl set image deployment/cartservice \
            server=532404261078.dkr.ecr.us-east-1.amazonaws.com/cartservice:${{ github.sha }}

      - name: Wait for rollout to complete
        id: rollout
        run: |
          kubectl rollout status deployment/cartservice --timeout=120s

      - name: Run integration test against live service
        id: integration_test
        run: |
          kubectl create configmap integration-test-proto-${{ github.run_id }} \
            --from-file=demo.proto=./protos/demo.proto \
            --dry-run=client -o yaml | kubectl apply -f -

          cat <<EOF > integration-test-pod.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: integration-test-${{ github.run_id }}
          spec:
            restartPolicy: Never
            containers:
              - name: integration-test
                image: fullstorydev/grpcurl:latest
                command: ["grpcurl", "-plaintext", "-import-path", "/protos", "-proto", "demo.proto", "cartservice:7070", "hipstershop.CartService/GetCart", "-d", "{\"user_id\":\"ci-smoke-test\"}"]
                volumeMounts:
                  - name: proto-vol
                    mountPath: /protos
            volumes:
              - name: proto-vol
                configMap:
                  name: integration-test-proto-${{ github.run_id }}
          EOF

          kubectl apply -f integration-test-pod.yaml

          # Poll for a terminal phase instead of waiting on "Ready" — a
          # run-to-completion pod never becomes Ready, it just finishes.
          PHASE=""
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod integration-test-${{ github.run_id }} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
              break
            fi
            sleep 2
          done

          echo "--- test pod logs ---"
          kubectl logs pod/integration-test-${{ github.run_id }} || true

          EXIT_CODE=$(kubectl get pod integration-test-${{ github.run_id }} \
            -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || echo "")

          kubectl delete pod integration-test-${{ github.run_id }} --ignore-not-found
          kubectl delete configmap integration-test-proto-${{ github.run_id }} --ignore-not-found

          if [ -z "$EXIT_CODE" ]; then
            echo "Test pod never reached a terminal state within timeout — treating as failure"
            exit 1
          fi

          exit "$EXIT_CODE"

      - name: Rollback on failure
        if: failure() && (steps.rollout.outcome == 'failure' || steps.integration_test.outcome == 'failure')
        run: |
          echo "Deployment or integration test failed — rolling back to previous version"
          kubectl rollout undo deployment/cartservice
          kubectl rollout status deployment/cartservice --timeout=120s

      - name: Confirm final state
        if: always()
        run: |
          kubectl get pods -l app=cartservice
          kubectl rollout history deployment/cartservice