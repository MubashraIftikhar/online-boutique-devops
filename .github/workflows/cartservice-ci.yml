name: cartservice CI
on:
  push:
    branches: [main]
    paths:
      - 'src/cartservice/**'
      - '.github/workflows/cartservice-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/cartservice/**'
jobs:
  lint-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cartservice/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test ../tests/cartservice.tests.csproj --no-restore --verbosity normal

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, codeql]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cartservice:${{ github.sha }} \
            src/cartservice/src

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cartservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.event_name == 'push'
        run: |
          docker tag cartservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/cartservice:${{ github.sha }}
          docker tag cartservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/cartservice:latest
          docker push ${{ steps.ecr.outputs.registry }}/cartservice:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/cartservice:latest
