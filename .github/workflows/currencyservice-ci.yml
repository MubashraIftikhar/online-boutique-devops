name: currencyservice CI
on:
  push:
    branches: [main]
    paths:
      - 'src/currencyservice/**'
      - '.github/workflows/currencyservice-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/currencyservice/**'
jobs:
  lint-and-test:
    name: Install and check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/currencyservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      # NOTE: this service currently has no real test script defined in
      # package.json ("Error: no test specified"). Once tests are added,
      # uncomment the step below.
      # - name: Run tests
      #   run: npm test

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, codeql]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t currencyservice:${{ github.sha }} \
            src/currencyservice

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: currencyservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.event_name == 'push'
        run: |
          docker tag currencyservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/currencyservice:${{ github.sha }}
          docker tag currencyservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/currencyservice:latest
          docker push ${{ steps.ecr.outputs.registry }}/currencyservice:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/currencyservice:latest
