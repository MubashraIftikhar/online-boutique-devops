name: shippingservice CI
on:
  push:
    branches: [dev, uat, prod]
    paths:
      - 'src/shippingservice/**'
      - '.github/workflows/shippingservice-ci.yml'
  pull_request:
    branches: [dev, uat, prod]
    paths:
      - 'src/shippingservice/**'

jobs:
  lint-and-test:
    name: Test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/shippingservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: shippingservice-coverage
          path: src/shippingservice/coverage.out

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Non-critical: don't block merges/deploys on CodeQL findings or transient
    # analysis failures. Results still show up in the Security tab.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test]  # codeql no longer gates the build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t shippingservice:${{ github.sha }} \
            src/shippingservice

      # Non-critical: vulnerability visibility only, exit-code 0 so it never
      # fails the job either way (kept explicit + continue-on-error as a
      # second safety net in case severity/exit-code settings change later).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: shippingservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          docker tag shippingservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/shippingservice:${{ github.sha }}
          docker tag shippingservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/shippingservice:latest
          docker push ${{ steps.ecr.outputs.registry }}/shippingservice:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/shippingservice:latest
