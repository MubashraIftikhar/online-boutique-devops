name: PR branch policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, uat, prod]

jobs:
  enforce-branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source → target branch
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"
          echo "PR: $HEAD → $BASE"

          case "$BASE" in
            dev)
              if [[ "$HEAD" != feature/* ]]; then
                echo "❌ dev only accepts PRs from feature/* branches. Got: $HEAD"
                exit 1
              fi
              ;;
            uat)
              if [[ "$HEAD" != feature/* ]]; then
                echo "❌ uat only accepts PRs from feature/* branches. Got: $HEAD"
                exit 1
              fi
              ;;
            prod)
              if [[ "$HEAD" == "dev" || "$HEAD" == "uat" ]]; then
                echo "❌ prod cannot be updated directly from dev or uat. Only feature/* or hotfix/* branches, via PR, are allowed. Got: $HEAD"
                exit 1
              elif [[ "$HEAD" != feature/* && "$HEAD" != hotfix/* ]]; then
                echo "❌ prod only accepts PRs from feature/* or hotfix/* branches. Got: $HEAD"
                exit 1
              fi
              ;;
          esac

          echo "✅ Branch flow OK: $HEAD → $BASE"