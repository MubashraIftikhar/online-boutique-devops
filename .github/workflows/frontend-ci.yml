name: frontend CI
on:
  push:
    branches: [dev, uat, prod]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [dev, uat, prod]
    paths:
      - 'src/frontend/**'
jobs:
  lint-and-test:
    name: Test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out
      - name: Show coverage summary
        run: go tool cover -func=coverage.out
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage.out
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t frontend:${{ github.sha }} \
            src/frontend
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: frontend:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        run: |
          docker tag frontend:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
          docker tag frontend:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/frontend:latest
          docker push ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/frontend:latest

  deploy:
    name: Deploy to k3s
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy new image
        run: |
          kubectl set image deployment/frontend \
            server=532404261078.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

      - name: Wait for rollout to complete
        id: rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Run integration test against live service
        id: integration_test
        run: |
          cat <<EOF > integration-test-pod.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: integration-test-${{ github.run_id }}
          spec:
            restartPolicy: Never
            containers:
              - name: integration-test
                image: curlimages/curl:latest
                command: ["sh", "-c", "curl -sf -o /dev/null -w '%{http_code}' http://frontend:8080/ | grep -q 200"]
          EOF

          kubectl apply -f integration-test-pod.yaml
          kubectl wait --for=condition=Ready pod/integration-test-${{ github.run_id }} --timeout=60s || true
          kubectl logs -f pod/integration-test-${{ github.run_id }}
          EXIT_CODE=$(kubectl get pod integration-test-${{ github.run_id }} -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}')

          kubectl delete pod integration-test-${{ github.run_id }} --ignore-not-found

          exit $EXIT_CODE

      - name: Rollback on failure
        if: failure() && (steps.rollout.outcome == 'failure' || steps.integration_test.outcome == 'failure')
        run: |
          echo "Deployment or integration test failed — rolling back to previous version"
          kubectl rollout undo deployment/frontend
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Confirm final state
        if: always()
        run: |
          kubectl get pods -l app=frontend
          kubectl rollout history deployment/frontend
