name: frontend CI
on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
jobs:
  lint-and-test:
    name: Test and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out
      - name: Show coverage summary
        run: go tool cover -func=coverage.out
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage.out
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Non-critical: don't block merges/deploys on CodeQL findings or transient
    # analysis failures. Results still show up in the Security tab.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test]  # codeql no longer gates the build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t frontend:${{ github.sha }} \
            src/frontend
      # Non-critical: vulnerability visibility only, exit-code 0 so it never
      # fails the job either way (kept explicit + continue-on-error as a
      # second safety net in case severity/exit-code settings change later).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: frontend:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push to ECR
        if: github.event_name == 'push'
        run: |
          docker tag frontend:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
          docker tag frontend:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/frontend:latest
          docker push ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/frontend:latest

  deploy:
    name: Deploy to k3s
    needs: build-and-scan
    if: github.event_name == 'push'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy new image
        run: |
          kubectl set image deployment/frontend \
            server=532404261078.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

      - name: Wait for rollout to complete
        id: rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=120s

      # frontend is a plain HTTP service (not gRPC), so the integration test
      # here is a real HTTP request against its /_healthz endpoint from
      # inside the cluster — the HTTP-appropriate equivalent of the gRPC
      # calls used for the other services.
      - name: Run integration test against live service
        id: integration_test
        run: |
          cat <<EOF > integration-test-pod.yaml
          apiVersion: v1
          kind: Pod
          metadata:
            name: integration-test-${{ github.run_id }}
          spec:
            restartPolicy: Never
            containers:
              - name: integration-test
                image: curlimages/curl:latest
                command: ["curl", "-sf", "http://frontend:80/_healthz"]
          EOF

          kubectl apply -f integration-test-pod.yaml

          # Poll for a terminal phase instead of waiting on "Ready" — a
          # run-to-completion pod never becomes Ready, it just finishes.
          PHASE=""
          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod integration-test-${{ github.run_id }} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
              break
            fi
            sleep 2
          done

          echo "--- test pod logs ---"
          kubectl logs pod/integration-test-${{ github.run_id }} || true

          EXIT_CODE=$(kubectl get pod integration-test-${{ github.run_id }} \
            -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || echo "")

          kubectl delete pod integration-test-${{ github.run_id }} --ignore-not-found

          if [ -z "$EXIT_CODE" ]; then
            echo "Test pod never reached a terminal state within timeout — treating as failure"
            exit 1
          fi

          exit "$EXIT_CODE"

      - name: Rollback on failure
        if: failure() && (steps.rollout.outcome == 'failure' || steps.integration_test.outcome == 'failure')
        run: |
          echo "Deployment or integration test failed — rolling back to previous version"
          kubectl rollout undo deployment/frontend
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Confirm final state
        if: always()
        run: |
          kubectl get pods -l app=frontend
          kubectl rollout history deployment/frontend
