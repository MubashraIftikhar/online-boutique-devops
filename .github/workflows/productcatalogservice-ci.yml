name: productcatalogservice CI

on:
  push:
    branches: [main]
    paths:
      - 'src/productcatalogservice/**'
      - '.github/workflows/productcatalogservice-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/productcatalogservice/**'

jobs:
  lint-and-test:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/productcatalogservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: src/productcatalogservice
          version: v2.12.2

      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: productcatalogservice-coverage
          path: src/productcatalogservice/coverage.out

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, codeql]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t productcatalogservice:${{ github.sha }} \
            src/productcatalogservice

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: productcatalogservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      # Next step once ECR is set up: authenticate to AWS and push this
      # image to ECR here, tagged with ${{ github.sha }}.
