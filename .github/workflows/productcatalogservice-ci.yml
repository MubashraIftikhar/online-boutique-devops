name: productcatalogservice CI

on:
  push:
    branches: [main]
    paths:
      - 'src/productcatalogservice/**'
      - '.github/workflows/productcatalogservice-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/productcatalogservice/**'

jobs:
  lint-and-test:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/productcatalogservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: src/productcatalogservice
          version: v2.12.2

      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: productcatalogservice-coverage
          path: src/productcatalogservice/coverage.out

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build-and-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: [lint-and-test, codeql]
    permissions:
      id-token: write      # required for OIDC -> AWS role assumption
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t productcatalogservice:${{ github.sha }} \
            src/productcatalogservice

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: productcatalogservice:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::532404261078:role/github-actions-ecr
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: github.event_name == 'push'
        run: |
          docker tag productcatalogservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/productcatalogservice:${{ github.sha }}
          docker tag productcatalogservice:${{ github.sha }} \
            ${{ steps.ecr.outputs.registry }}/productcatalogservice:latest
          docker push ${{ steps.ecr.outputs.registry }}/productcatalogservice:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/productcatalogservice:latest
